name: Collecte HV

on:
  schedule:
    - cron: "7 * * * *"        # toutes les heures, à h+07
  workflow_dispatch:
    inputs:
      discover:
        description: "Mode découverte (trouver les numéros d'HV)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collecte-hv
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Mode découverte
        if: ${{ inputs.discover }}
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: python collector.py --discover

      - name: Récupérer l'historique (branche data)
        if: ${{ !inputs.discover }}
        run: |
          git clone --depth 1 --branch data \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" site \
            || mkdir -p site

      - name: Collecte
        if: ${{ !inputs.discover }}
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SITE_DIR: site
        run: |
          python collector.py
          cp web/index.html site/public/index.html

      - name: Sauvegarder l'historique
        if: ${{ !inputs.discover }}
        run: |
          cd site
          rm -rf .git
          git init -q -b data
          git config user.name "collecte-hv"
          git config user.email "collecte-hv@users.noreply.github.com"
          git add -A
          git commit -q -m "Données $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.discover }}
        with:
          path: site/public

  # Publication dans un job séparé (comme le modèle officiel de GitHub) : quand l'envoi et la
  # publication sont dans le même job, GitHub ne retrouve parfois pas la page qu'il vient de recevoir.
  deploy:
    needs: collect
    if: ${{ !inputs.discover }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Petite pause (laisser GitHub enregistrer la page)
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
