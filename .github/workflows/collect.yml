name: Collecte HV

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      discover:
        description: "Mode découverte (trouver les numéros d'HV)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collecte-hv
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Mode découverte
        if: ${{ inputs.discover }}
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: python collector.py --discover

      - name: Récupérer l'historique (branche data)
        if: ${{ !inputs.discover }}
        run: |
          git clone --depth 1 --branch data \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" site \
            || mkdir -p site

      - name: Collecte
        if: ${{ !inputs.discover }}
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          SITE_DIR: site
        run: |
          python collector.py
          cp web/index.html site/public/index.html

      - name: Sauvegarder l'historique
        if: ${{ !inputs.discover }}
        run: |
          cd site
          rm -rf .git
          git init -q -b data
          git config user.name "collecte-hv"
          git config user.email "collecte-hv@users.noreply.github.com"
          git add -A
          git commit -q -m "Données $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.discover }}
        with:
          path: site/public

      - uses: actions/deploy-pages@v4
        if: ${{ !inputs.discover }}
