<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon HV — WoW Forever</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e7e9ee; --muted:#8b93a3; --accent:#e0b44c; --up:#4fc17b; --down:#e3605a;
    --gold:#e0b44c; --silver:#c0c6cf; --copper:#c8794a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{font-size:18px;margin:0;letter-spacing:.2px}
  h1 span{color:var(--accent)}
  .meta{color:var(--muted);font-size:12.5px}
  .spacer{flex:1}
  select,input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
  input:focus,select:focus{outline:1px solid var(--accent)}
  nav{display:flex;gap:4px;padding:10px 24px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--panel)}
  nav button{background:none;border:0;color:var(--muted);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
  nav button:hover{color:var(--text);background:var(--panel2)}
  nav button.on{color:var(--bg);background:var(--accent);font-weight:600}
  main{padding:20px 24px;max-width:1200px;margin:0 auto}
  .intro{color:var(--muted);margin:0 0 14px}
  .tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel2);text-transform:uppercase;letter-spacing:.4px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.row{cursor:pointer}
  tr.row:hover td{background:var(--panel2)}
  tr:last-child td{border-bottom:0}
  .item{display:flex;align-items:center;gap:8px;white-space:normal}
  .item img{width:22px;height:22px;border-radius:4px;border:1px solid #000}
  .ph{width:22px;height:22px;border-radius:4px;background:var(--panel2);display:inline-block}
  .q-POOR{color:#9d9d9d}.q-COMMON{color:#f0f0f0}.q-UNCOMMON{color:#1eff00}.q-RARE{color:#3d8eff}.q-EPIC{color:#b964f5}.q-LEGENDARY{color:#ff8000}
  .po{color:var(--gold)}.pa{color:var(--silver)}.pc{color:var(--copper)}
  .up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--muted)}
  .tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .tag.hit{background:rgba(79,193,123,.15);color:var(--up);border-color:rgba(79,193,123,.4)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:800px){.grid2{grid-template-columns:1fr} header,nav,main{padding-left:14px;padding-right:14px}}
  h2{font-size:15px;margin:4px 0 10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .recipe-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
  .profit{font-size:16px;font-weight:600}
  .recipe table{margin-top:10px}
  .empty{padding:30px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:10px}
  .star{background:none;border:0;cursor:pointer;font-size:16px;color:var(--muted);padding:0 4px}
  .star.on{color:var(--accent)}
  /* fenêtre objet */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto;z-index:10}
  .modal.open{display:flex}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:760px;padding:20px}
  .box-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .box-head img{width:40px;height:40px;border-radius:6px;border:1px solid #000}
  .box-head h3{margin:0;font-size:18px}
  .close{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
  .stat{background:var(--panel2);border-radius:8px;padding:10px 12px}
  .stat b{display:block;font-size:15px;margin-top:2px}
  .stat small{color:var(--muted);font-size:12px}
  svg text{fill:var(--muted);font-size:11px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:6px 0}
  .legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
  .watch-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .btn{background:var(--accent);color:var(--bg);border:0;border-radius:8px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:400}
  .more{margin-top:10px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Mon <span>HV</span> · WoW Forever</h1>
  <div class="meta" id="meta">Chargement…</div>
  <div class="spacer"></div>
  <select id="house" title="Hôtel des ventes"></select>
</header>
<nav id="tabs"></nav>
<main id="view"></main>

<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script>
const TABS = [
  ["watch", "Ma liste"],
  ["deals", "Bonnes affaires"],
  ["sell", "À vendre aujourd'hui"],
  ["prices", "Prix du jour"],
  ["catalog", "Tous les objets"],
  ["movers", "Mouvements de la semaine"],
  ["crafts", "Métiers"],
];
const DAYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const S = { meta:null, items:{}, recipes:[], cur:{}, house:null, tab:"deals", limit:200, histCache:{} };

/* ---------- stockage local (liste perso) ---------- */
function getWatch(){ try{ return JSON.parse(localStorage.getItem("hv-watch")||"{}"); }catch(e){ return S._watch||{}; } }
function setWatch(w){ S._watch=w; try{ localStorage.setItem("hv-watch", JSON.stringify(w)); }catch(e){} }

/* ---------- formats ---------- */
function money(c){
  if(c==null) return '<span class="mut">—</span>';
  c=Math.round(c); const g=Math.floor(c/10000), s=Math.floor(c%10000/100), k=c%100;
  let out=[];
  if(g) out.push(`<span class="po">${g.toLocaleString("fr-FR")}po</span>`);
  if(s||g) out.push(`<span class="pa">${s}pa</span>`);
  if(!g) out.push(`<span class="pc">${k}pc</span>`);
  return out.join(" ");
}
function pct(v){ if(v==null) return '<span class="mut">—</span>'; const cl=v>0?"up":v<0?"down":"mut"; return `<span class="${cl}">${v>0?"+":""}${v.toLocaleString("fr-FR")} %</span>`; }
function num(v,d=0){ return v==null?'<span class="mut">—</span>':v.toLocaleString("fr-FR",{maximumFractionDigits:d}); }
function parseMoney(str){
  str=(str||"").toLowerCase().replace(",",".").trim(); if(!str) return null;
  if(/^\d+(\.\d+)?$/.test(str)) return Math.round(parseFloat(str)*10000);
  let c=0, m;
  if(m=str.match(/(\d+)\s*po/)) c+=+m[1]*10000;
  if(m=str.match(/(\d+)\s*pa/)) c+=+m[1]*100;
  if(m=str.match(/(\d+)\s*pc/)) c+=+m[1];
  return c||null;
}
function info(id){ return S.items[id] || {n:`Objet #${id} (nom bientôt disponible)`, c:"Autre", ql:"COMMON"}; }
function itemCell(id){
  const it=info(id);
  const img=it.i?`<img src="${it.i}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;ph&quot;></span>'">`:'<span class="ph"></span>';
  return `<span class="item">${img}<span class="q-${it.ql}">${esc(it.n)}</span></span>`;
}
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ago(ts){ const m=Math.round((Date.now()/1000-ts)/60); return m<60?`il y a ${m} min`:`il y a ${Math.round(m/60)} h`; }

/* ---------- chargement ---------- */
async function getJSON(url, fallback){ try{ const r=await fetch(url,{cache:"no-store"}); if(!r.ok) throw 0; return await r.json(); }catch(e){ return fallback; } }

async function init(){
  S.meta = await getJSON("data/meta.json", null);
  if(!S.meta || !Object.keys(S.meta.houses||{}).length){
    document.getElementById("meta").textContent="Pas encore de données";
    document.getElementById("view").innerHTML='<div class="empty">Aucune donnée pour l\'instant. La première collecte apparaît ici dans l\'heure qui suit l\'installation.</div>';
    return;
  }
  let starter;
  [S.items, S.recipes, starter] = await Promise.all([getJSON("data/items.json",{}), getJSON("data/recipes.json",[]), getJSON("data/watchlist.json",[])]);
  let fresh=true; try{ fresh=localStorage.getItem("hv-watch")===null; }catch(e){}
  if(fresh && starter.length){ const w={}; starter.forEach(s=>w[s.id]={target:null}); setWatch(w); }
  const sel=document.getElementById("house");
  const names={alliance:"Alliance",horde:"Horde",blackwater:"Eaux-Noires"};
  sel.innerHTML=Object.keys(S.meta.houses).map(h=>`<option value="${h}">${names[h]||h}</option>`).join("");
  sel.onchange=()=>loadHouse(sel.value);
  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.k;S.limit=200;render();});
  if(Object.keys(getWatch()).length) S.tab="watch";
  await loadHouse(sel.value);
}
async function loadHouse(h){
  S.house=h; S.histCache={};
  const d=await getJSON(`data/${h}/current.json`,{items:{}});
  S.cur=d.items||{};
  const m=S.meta.houses[h];
  document.getElementById("meta").innerHTML=
    `Mis à jour ${ago(m.ts)} · ${num(m.listings)} annonces · ${num(m.items)} objets`;
  render();
}

/* ---------- vues ---------- */
function rows(list, cols){
  if(!list.length) return '<div class="empty">Rien à afficher pour le moment.</div>';
  const shown=list.slice(0,S.limit);
  const head=cols.map(c=>`<th class="${c.num?"num":""}">${c.t}</th>`).join("");
  const body=shown.map(([id,d])=>`<tr class="row" data-id="${id}">`+cols.map(c=>`<td class="${c.num?"num":""}">${c.f(id,d)}</td>`).join("")+"</tr>").join("");
  const more=list.length>S.limit?`<div class="more"><button class="btn ghost" id="more">Afficher plus (${list.length-S.limit} restants)</button></div>`:"";
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>${more}`;
}
const C = {
  item:{t:"Objet",f:id=>itemCell(id)},
  price:{t:"Plus bas",num:1,f:(id,d)=>money(d.p)},
  med7:{t:"Médiane 7 j",num:1,f:(id,d)=>money(d.m7)},
  d1:{t:"Vs hier",num:1,f:(id,d)=>pct(d.d1)},
  w1:{t:"Sur 7 j",num:1,f:(id,d)=>pct(d.w1)},
  qty:{t:"En vente",num:1,f:(id,d)=>num(d.q)},
  sales:{t:"Ventes / jour",num:1,f:(id,d)=>num(d.s7,1)},
  disc:{t:"Remise",num:1,f:(id,d)=>`<span class="up">−${Math.round((1-d.p/d.m7)*100)} %</span>`},
  turnover:{t:"Volume / jour",num:1,f:(id,d)=>d.s7?money(d.s7*d.m7):'<span class="mut">—</span>'},
};
function entries(){ return Object.entries(S.cur); }

const VIEWS = {
  watch(){
    const w=getWatch(), list=Object.keys(w).filter(id=>S.cur[id]||S.items[id]).map(id=>[id,S.cur[id]||{p:null}]);
    const intro='<p class="intro">Les objets que vous suivez. Ajoutez-en depuis n\'importe quelle ligne (cliquez dessus) et fixez un prix d\'achat cible : la ligne passe en vert quand le prix tombe en dessous.</p>';
    if(!list.length) return intro+'<div class="empty">Votre liste est vide. Cliquez sur un objet dans un autre onglet puis sur « Suivre ».</div>';
    list.sort((a,b)=>(!a[1].p-!b[1].p)||info(a[0]).n.localeCompare(info(b[0]).n,"fr"));
    return intro+rows(list,[C.item,C.price,{t:"Cible",num:1,f:id=>{const t=w[id].target;const d=S.cur[id];if(!t)return'<span class="mut">—</span>';const hit=d&&d.p&&d.p<=t;return `${money(t)} ${hit?'<span class="tag hit">à acheter</span>':""}`;}},C.med7,C.d1,C.qty,C.sales]);
  },
  deals(){
    const list=entries().filter(([,d])=>d.m7>=100&&d.p<=d.m7*0.75&&(d.s7==null||d.s7>=1))
      .sort((a,b)=>a[1].p/a[1].m7-b[1].p/b[1].m7);
    return '<p class="intro">Annonces au moins 25 % sous leur médiane des 7 derniers jours, sur des objets qui se vendent (au moins 1 par jour). À racheter pour revendre au prix normal.</p>'
      + rows(list,[C.item,C.price,C.med7,C.disc,C.qty,C.sales]);
  },
  sell(){
    const list=entries().filter(([,d])=>d.s7>=3&&d.p>=d.m7*0.97)
      .sort((a,b)=>b[1].s7*b[1].m7-a[1].s7*a[1].m7);
    return '<p class="intro">Ce qui part le plus vite, quand le prix actuel est au niveau ou au-dessus de la médiane de la semaine : bon moment pour vendre. Classé par or échangé par jour.</p>'
      + rows(list,[C.item,C.price,C.med7,C.d1,C.sales,C.turnover]);
  },
  prices(){
    const cats=[...new Set(Object.keys(S.cur).map(id=>info(id).c))].sort((a,b)=>a.localeCompare(b,"fr"));
    const q=norm(S.q||""), cat=S.cat||"", sort=S.sort||"turn";
    let list=entries().filter(([id])=>{const it=info(id);return (!cat||it.c===cat)&&(!q||norm(it.n).includes(q));});
    const sorters={
      turn:(a,b)=>((b[1].s7??b[1].q/20)*b[1].m7)-((a[1].s7??a[1].q/20)*a[1].m7),
      name:(a,b)=>info(a[0]).n.localeCompare(info(b[0]).n,"fr"),
      up:(a,b)=>(b[1].d1??-1e9)-(a[1].d1??-1e9),
      down:(a,b)=>(a[1].d1??1e9)-(b[1].d1??1e9),
      price:(a,b)=>b[1].p-a[1].p,
      qty:(a,b)=>b[1].q-a[1].q,
    };
    list.sort(sorters[sort]);
    const tools=`<div class="tools">
      <input id="q" placeholder="Rechercher un objet…" value="${esc(S.q||"")}" style="min-width:220px">
      <select id="cat"><option value="">Toutes catégories</option>${cats.map(c=>`<option ${c===cat?"selected":""}>${esc(c)}</option>`).join("")}</select>
      <select id="sort">${[["turn","Les plus échangés"],["name","Nom"],["up","Plus forte hausse"],["down","Plus forte baisse"],["price","Prix"],["qty","Quantité en vente"]].map(([k,l])=>`<option value="${k}" ${k===sort?"selected":""}>${l}</option>`).join("")}</select>
    </div>`;
    return tools+rows(list,[C.item,C.price,C.d1,C.med7,C.qty,C.sales]);
  },
  catalog(){
    const all=Object.keys(S.items);
    if(!all.length) return '<div class="empty">Le catalogue se remplit au prochain passage de la collecte.</div>';
    const cats=[...new Set(all.map(id=>S.items[id].c))].sort((a,b)=>a.localeCompare(b,"fr"));
    const cat=S.ccat||"", sub=S.csub||"", ql=S.cql||"", onlyAH=!!S.cah, q=norm(S.cq||"");
    const subs=cat?[...new Set(all.filter(id=>S.items[id].c===cat).map(id=>S.items[id].sc).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"fr")):[];
    const QL=[["POOR","Médiocre"],["COMMON","Commun"],["UNCOMMON","Inhabituel"],["RARE","Rare"],["EPIC","Épique"],["LEGENDARY","Légendaire"]];
    let list=all.filter(id=>{const it=S.items[id];
      return (!cat||it.c===cat)&&(!sub||it.sc===sub)&&(!ql||it.ql===ql)&&(!onlyAH||S.cur[id])&&(!q||norm(it.n).includes(q));})
      .map(id=>[id,S.cur[id]||null]);
    list.sort((a,b)=>(!a[1]-!b[1])||S.items[a[0]].n.localeCompare(S.items[b[0]].n,"fr"));
    const opt=(v,l,cur)=>`<option value="${esc(v)}" ${v===cur?"selected":""}>${esc(l)}</option>`;
    const tools=`<p class="intro">Tous les objets du jeu (${num(all.length)}), en vente ou non : ressources, équipement, patrons, recettes, formules… Les objets en vente sur cet HV s'affichent en premier.</p>
    <div class="tools">
      <input data-f="cq" data-text="1" placeholder="Rechercher un objet…" value="${esc(S.cq||"")}" style="min-width:220px">
      <select data-f="ccat"><option value="">Toutes catégories</option>${cats.map(c=>opt(c,c,cat)).join("")}</select>
      ${cat&&subs.length?`<select data-f="csub"><option value="">Toutes sous-catégories</option>${subs.map(c=>opt(c,c,sub)).join("")}</select>`:""}
      <select data-f="cql"><option value="">Toutes qualités</option>${QL.map(([k,l])=>opt(k,l,ql)).join("")}</select>
      <label class="mut" style="display:flex;align-items:center;gap:6px"><input type="checkbox" data-f="cah" ${onlyAH?"checked":""}> En vente seulement</label>
    </div><p class="mut" style="margin:0 0 10px">${num(list.length)} résultat${list.length>1?"s":""}</p>`;
    return tools+rows(list,[C.item,
      {t:"Catégorie",f:id=>{const it=S.items[id];return `<span class="mut">${esc(it.c)}${it.sc?" · "+esc(it.sc):""}</span>`;}},
      {t:"Plus bas",num:1,f:(id,d)=>d?money(d.p):'<span class="tag">pas en vente</span>'},
      {t:"Médiane 7 j",num:1,f:(id,d)=>d?money(d.m7):'<span class="mut">—</span>'},
      {t:"En vente",num:1,f:(id,d)=>d?num(d.q):'<span class="mut">—</span>'},
      {t:"Ventes / jour",num:1,f:(id,d)=>d?num(d.s7,1):'<span class="mut">—</span>'}]);
  },
  movers(){
    const base=entries().filter(([,d])=>d.w1!=null&&d.m7>=100&&((d.s7||0)>=1||d.q>=20));
    const ups=[...base].sort((a,b)=>b[1].w1-a[1].w1).slice(0,25);
    const downs=[...base].sort((a,b)=>a[1].w1-b[1].w1).slice(0,25);
    const cols=[C.item,C.price,C.w1,C.sales];
    const keep=S.limit; S.limit=25;
    const html='<p class="intro">Plus fortes variations du prix le plus bas sur 7 jours (objets qui se vendent vraiment).</p><div class="grid2"><div><h2 class="up">En hausse</h2>'+rows(ups,cols)+'</div><div><h2 class="down">En baisse</h2>'+rows(downs,cols)+'</div></div>';
    S.limit=keep; return html;
  },
  crafts(){
    const cut=S.meta.ah_cut??0.05;
    if(!S.recipes.length) return '<div class="empty">Aucune recette. Ajoutez les vôtres dans le fichier recipes.json.</div>';
    const cards=S.recipes.map(r=>{
      let cost=0, missing=false;
      const lines=r.reagents.map(g=>{
        const d=S.cur[g.id]; let unit=null, src="HV";
        if(g.vendor_price!=null){unit=g.vendor_price;src="PNJ";} else if(d){unit=d.p;}
        if(unit==null||(src==="PNJ"&&!unit)) missing=true;
        if(unit!=null) cost+=unit*g.qty;
        return `<tr class="row" data-id="${g.id}"><td>${itemCell(g.id)}</td><td class="num">× ${g.qty}</td><td class="num">${money(unit)} <span class="tag">${src}</span></td><td class="num">${unit==null?"—":money(unit*g.qty)}</td></tr>`
          + (g.note && !g.vendor_price ? `<tr><td colspan="4" class="mut" style="white-space:normal;font-size:12.5px">⚠ ${esc(g.note)}</td></tr>`:"");
      }).join("");
      const out=S.cur[r.makes.id];
      const sale=out?out.p*r.makes.qty*(1-cut):null;
      const saleMed=out?out.m7*r.makes.qty*(1-cut):null;
      const profit=sale!=null&&!missing?sale-cost:null;
      const cl=profit==null?"mut":profit>=0?"up":"down";
      return `<div class="card recipe">
        <div class="recipe-head"><div><span class="tag">${esc(r.profession||"")}</span> <b>${esc(r.name)}</b></div>
          <div class="profit ${cl}">${profit==null?"Prix manquant":(profit>=0?"+":"−")+" "+money(Math.abs(profit))+" / craft"}</div></div>
        <div class="mut" style="margin-top:6px">Coût ${money(cost)} · Revente ${money(sale)} après ${Math.round(cut*100)} % de taxe HV (au prix médian : ${money(saleMed)}) · ${out&&out.s7?num(out.s7,1)+" ventes / jour":"ventes / jour inconnues"}</div>
        <table><thead><tr><th>Composant</th><th class="num">Qté</th><th class="num">Prix unitaire</th><th class="num">Total</th></tr></thead><tbody>${lines}
        <tr class="row" data-id="${r.makes.id}"><td>${itemCell(r.makes.id)} <span class="tag">produit</span></td><td class="num">× ${r.makes.qty}</td><td class="num">${money(out?out.p:null)}</td><td class="num">${money(sale)}</td></tr></tbody></table>
      </div>`;
    });
    return `<p class="intro">Rentabilité au prix le plus bas actuel. Les recettes se modifient dans le fichier recipes.json.</p>`+cards.join("");
  },
};

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===S.tab));
  const v=document.getElementById("view");
  v.innerHTML=VIEWS[S.tab]();
  v.querySelectorAll("tr.row").forEach(tr=>tr.onclick=()=>openItem(tr.dataset.id));
  const more=document.getElementById("more"); if(more) more.onclick=()=>{S.limit+=200;render();};
  const q=document.getElementById("q");
  if(q){
    q.oninput=e=>{S.q=e.target.value;S.limit=200;clearTimeout(S._t);S._t=setTimeout(()=>{render();const n=document.getElementById("q");n.focus();n.setSelectionRange(n.value.length,n.value.length);},250);};
    document.getElementById("cat").onchange=e=>{S.cat=e.target.value;render();};
    document.getElementById("sort").onchange=e=>{S.sort=e.target.value;render();};
  }
  v.querySelectorAll("[data-f]").forEach(el=>{
    const f=el.dataset.f;
    if(el.dataset.text){
      el.oninput=e=>{S[f]=e.target.value;S.limit=200;clearTimeout(S._t);S._t=setTimeout(()=>{render();const n=document.querySelector(`[data-f="${f}"]`);n.focus();n.setSelectionRange(n.value.length,n.value.length);},250);};
    } else {
      el.onchange=e=>{S[f]=el.type==="checkbox"?el.checked:el.value;if(f==="ccat")S.csub="";S.limit=200;render();};
    }
  });
}

/* ---------- fenêtre objet ---------- */
async function history(id){
  const shard=Number(id)%50;
  if(!S.histCache[shard]) S.histCache[shard]=await getJSON(`data/${S.house}/history/${shard}.json`,{});
  return S.histCache[shard][id]||[];
}
function chart(rows){
  rows=rows.filter(r=>r[1]!=null);
  if(rows.length<2) return '<div class="empty" style="padding:18px">Pas encore assez d\'historique pour un graphique (2 jours minimum).</div>';
  const W=700,H=220,P={l:64,r:12,t:10,b:26};
  const vals=rows.flatMap(r=>[r[1],r[2]]).filter(v=>v!=null);
  let lo=Math.min(...vals), hi=Math.max(...vals); if(lo===hi){lo*=.9;hi*=1.1;}
  const x=i=>P.l+i*(W-P.l-P.r)/(rows.length-1), y=v=>P.t+(hi-v)*(H-P.t-P.b)/(hi-lo);
  const line=(k,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2" points="${rows.map((r,i)=>r[k]==null?"":`${x(i)},${y(r[k])}`).join(" ")}"/>`;
  const ticks=[0,.5,1].map(f=>{const v=lo+(hi-lo)*f;return `<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#2a2f3a"/><text x="${P.l-6}" y="${y(v)+4}" text-anchor="end">${plain(v)}</text>`;}).join("");
  const step=Math.max(1,Math.ceil(rows.length/7));
  const labels=rows.map((r,i)=>i%step?"":`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${r[0].slice(8,10)}/${r[0].slice(5,7)}</text>`).join("");
  return `<div class="legend"><span><i style="background:#e0b44c"></i>Plus bas du jour</span><span><i style="background:#6c8cff"></i>Médiane moyenne</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%">${ticks}${line(2,"#6c8cff")}${line(1,"#e0b44c")}${labels}</svg>`;
}
function plain(c){ c=Math.round(c); return c>=10000?(c/10000).toLocaleString("fr-FR",{maximumFractionDigits:c>=1e6?0:1})+"po":c>=100?Math.round(c/100)+"pa":c+"pc"; }
function weekdays(rows){
  rows=rows.filter(r=>r[1]!=null&&r[5]>=12);
  if(rows.length<14) return null;
  const mean=rows.reduce((s,r)=>s+r[1],0)/rows.length, by={};
  rows.forEach(r=>{const d=new Date(r[0]+"T12:00:00Z").getUTCDay();(by[d]=by[d]||[]).push(r[1]);});
  const avg=Object.entries(by).map(([d,v])=>[+d,(v.reduce((a,b)=>a+b,0)/v.length-mean)/mean*100]);
  avg.sort((a,b)=>a[1]-b[1]);
  return {buy:avg[0], sell:avg[avg.length-1]};
}
async function openItem(id){
  const it=info(id), d=S.cur[id];
  const all=await history(id); let range=S.range||30;
  const draw=()=>{
    const w=getWatch(), rs=all.slice(-range), wd=weekdays(all);
    document.getElementById("box").innerHTML=`
      <div class="box-head">${it.i?`<img src="${it.i}" alt="" onerror="this.style.visibility='hidden'">`:'<span class="ph" style="width:40px;height:40px"></span>'}
        <div><h3 class="q-${it.ql}">${esc(it.n)}</h3><div class="mut">${esc(it.c)}${it.sc?" · "+esc(it.sc):""}</div></div>
        <button class="close" id="x">Fermer</button></div>
      <div class="stats">
        <div class="stat"><small>Plus bas actuel</small><b>${money(d&&d.p)}</b></div>
        <div class="stat"><small>Médiane 7 jours</small><b>${money(d&&d.m7)}</b></div>
        <div class="stat"><small>Vs hier / 7 jours</small><b>${pct(d&&d.d1)} · ${pct(d&&d.w1)}</b></div>
        <div class="stat"><small>En vente / annonces</small><b>${num(d&&d.q)} / ${num(d&&d.n)}</b></div>
        <div class="stat"><small>Ventes estimées / jour</small><b>${num(d&&d.s7,1)}</b></div>
      </div>
      ${d&&d.n<=2&&d.q<5?'<p class="mut">⚠ Très peu d\'unités en vente : le prix affiché n\'est pas forcément représentatif.</p>':""}
      <div class="tools"><button class="btn ghost" data-r="30" ${range===30?'style="outline:1px solid #e0b44c"':""}>30 jours</button><button class="btn ghost" data-r="90" ${range===90?'style="outline:1px solid #e0b44c"':""}>90 jours</button></div>
      ${chart(rs)}
      <p class="mut">${wd?`Meilleur jour pour acheter : <b class="up">${DAYS[wd.buy[0]]}</b> (${wd.buy[1].toFixed(1).replace(".",",")} % vs moyenne) · pour vendre : <b class="down">${DAYS[wd.sell[0]]}</b> (+${wd.sell[1].toFixed(1).replace(".",",")} %)`:"Les meilleurs jours d'achat et de vente s'afficheront après 14 jours d'historique."}</p>
      <div class="watch-form">
        ${w[id]?`<span>Prix cible :</span><input id="tg" placeholder="ex. 12po 50pa" value="${w[id].target?plainFull(w[id].target):""}" style="width:150px"><button class="btn" id="sv">Enregistrer</button><button class="btn ghost" id="rm">Ne plus suivre</button>`
          :`<button class="btn" id="add">★ Suivre cet objet</button>`}
      </div>`;
    document.getElementById("x").onclick=closeModal;
    document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{range=S.range=+b.dataset.r;draw();});
    const add=document.getElementById("add"); if(add) add.onclick=()=>{const w=getWatch();w[id]={target:null};setWatch(w);draw();if(S.tab==="watch")render();};
    const sv=document.getElementById("sv"); if(sv) sv.onclick=()=>{const w=getWatch();w[id]={target:parseMoney(document.getElementById("tg").value)};setWatch(w);closeModal();render();};
    const rm=document.getElementById("rm"); if(rm) rm.onclick=()=>{const w=getWatch();delete w[id];setWatch(w);closeModal();render();};
  };
  draw();
  document.getElementById("modal").classList.add("open");
}
function plainFull(c){ const g=Math.floor(c/10000), s=Math.floor(c%10000/100), k=c%100; return [g?g+"po":"",s?s+"pa":"",k?k+"pc":""].filter(Boolean).join(" "); }
function closeModal(){ document.getElementById("modal").classList.remove("open"); }
document.getElementById("modal").onclick=e=>{ if(e.target.id==="modal") closeModal(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
init();
</script>
